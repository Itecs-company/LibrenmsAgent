version: '3.8'

services:
  librenms-agent:
    container_name: librenms-agent
    build:
      context: .
      args:
        API_KEY: ${API_KEY:-}
    restart: unless-stopped
    ports:
      - "8888:80"
      - "161:161/udp"
    environment:
      - TZ=UTC
      - LIBRENMS_URL=${LIBRENMS_URL}
      - LIBRENMS_API_TOKEN=${LIBRENMS_API_TOKEN}
      - SNMP_TARGET=${SNMP_TARGET}
      - SNMP_TRAP_PORT=${SNMP_TRAP_PORT:-162}
      - SNMP_COMMUNITY=${SNMP_COMMUNITY:-public}
      - SNMP_LISTEN_PORT=${SNMP_LISTEN_PORT:-161}
      - AGENT_INTERVAL=${AGENT_INTERVAL:-60}
      - AGENT_HOSTNAME=${AGENT_HOSTNAME:-librenms-edge-agent}
